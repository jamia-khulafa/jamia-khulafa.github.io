<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="جامعہ خلفائے راشدین رضی اللہ عنہم — قرآن و سنت کی تعلیم کا مرکز">
<title>جامعہ خلفائے راشدین رضی اللہ عنہم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#167447;--green2:#218957;--mint:#e9f7ef;--gold:#b5d9bf;--cream:#f7fbf8;--ink:#173b2a;--muted:#60766a;--white:#fff;--shadow:0 12px 34px rgba(20,92,55,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:86px}
body{margin:0;font-family:"Noto Nastaliq Urdu",Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:2.1;text-align:right}
a{color:inherit}
.topline{height:5px;background:linear-gradient(90deg,#167447,#a8e0bd,#167447)}
header{position:relative;overflow:hidden;background:radial-gradient(ellipse at top left,rgba(33,137,87,.10),transparent 42%),linear-gradient(135deg,#ffffff,#f0faf3);color:var(--ink);padding:26px 18px 32px;text-align:center;border-bottom:1px solid #e0eee5}
header:after{content:"۞";position:absolute;left:4%;bottom:-68px;font-size:220px;color:rgba(22,116,71,.045);pointer-events:none}
.brand{position:relative;z-index:1;max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:center;gap:18px}
.logo{width:100px;height:100px;object-fit:contain;background:#fff;border:3px solid #d7ecdf;border-radius:50%;padding:5px;box-shadow:0 6px 24px #0002}
.brand-copy h1{font-size:clamp(23px,4vw,38px);line-height:1.8;margin:0;color:var(--green)}
.brand-copy p{margin:3px 0;color:var(--green2);font-size:15px}
.tagline{position:relative;z-index:1;margin:16px auto 0;font-size:15px;color:var(--muted)}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:10px 12px;display:flex;justify-content:center;align-items:center;gap:6px 10px;flex-wrap:wrap;box-shadow:0 5px 18px #145c3710;border-bottom:1px solid #e4efe7}
nav a{text-decoration:none;color:var(--green);padding:7px 13px;font-weight:600;border-radius:24px;font-size:14px;transition:.2s}
nav a:hover,nav a:focus{background:var(--mint);color:var(--green);outline:none}
.hero{max-width:1160px;margin:28px auto 0;padding:0 18px}
.hero-panel{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;min-height:360px;background:linear-gradient(110deg,rgba(12,83,47,.93),rgba(23,116,71,.78)),url("masjid.jpg") center/cover no-repeat;color:white;display:flex;align-items:center;padding:clamp(24px,5vw,58px);box-shadow:var(--shadow)}
.hero-panel:after{content:"۞";position:absolute;z-index:-1;left:5%;bottom:-80px;font-size:260px;color:#ffffff0b}
.hero-copy{max-width:700px}
.eyebrow{display:inline-block;color:#e3f8e9;border:1px solid #b8e4c7;border-radius:24px;padding:3px 14px;font-size:13px;margin-bottom:12px}
.hero h2{font-size:clamp(27px,4.5vw,48px);line-height:1.75;margin:0 0 12px;color:white}
.hero p{font-size:16px;color:#e8f5ec;max-width:620px;margin:0 0 22px}
.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#dff5e6;color:#145b35;border:1px solid #dff5e6;padding:9px 22px;border-radius:12px;margin:4px;font-weight:700;transition:transform .2s,background .2s}
.button:hover{transform:translateY(-2px);background:#c8efd5}
.button.secondary{background:transparent;color:white;border-color:#ffffff90}
main{max-width:1160px;margin:auto;padding:8px 18px 38px}
.card{background:white;margin:26px 0;padding:clamp(22px,4vw,38px);border:1px solid #e1eee5;border-radius:22px;box-shadow:var(--shadow);scroll-margin-top:95px}
.section-heading{text-align:center;margin:0 auto 24px}
.section-heading .kicker{color:var(--green2);font-size:13px;margin:0}
h2{color:var(--green);font-size:clamp(23px,3vw,31px);line-height:1.8;margin:0}
.section-heading p{margin:4px 0 0;color:var(--muted);font-size:14px}
.intro-text{max-width:850px;margin:auto;text-align:center;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.item{background:linear-gradient(145deg,#ffffff,#f2faf5);border:1px solid #e0eee5;border-radius:18px;padding:20px;overflow-wrap:anywhere;box-shadow:0 5px 18px rgba(20,92,55,.035);transition:transform .2s,box-shadow .2s}.item:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(20,92,55,.09)}
.item h3{font-size:19px;color:var(--green);margin:0 0 7px}
.item p{margin:4px 0;color:#526b5d}
.icon-box{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 12px;background:linear-gradient(135deg,#e2f6e9,#f4fcf6);color:var(--green);border:1px solid #d8eee0;border-radius:18px;font-size:25px}
.feature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0 0}
.feature{background:white;border:1px solid #e0eee5;border-radius:18px;padding:18px 12px;text-align:center;box-shadow:0 6px 20px #145c3708}
.feature strong{display:block;color:var(--green);font-size:15px}
.gallery-photo{height:210px;overflow:hidden;border-radius:13px;background:linear-gradient(135deg,#e7f6ec,#f8fcf9);position:relative}.gallery-photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s}.gallery .item:hover img{transform:scale(1.035)}.gallery-photo.image-missing:after{content:"جامعہ کی تصویر";position:absolute;inset:0;display:grid;place-items:center;color:#167447;font-size:18px;font-weight:700;background:radial-gradient(circle at 25% 25%,#fff,transparent 40%),linear-gradient(135deg,#e7f6ec,#f8fcf9)}
.gallery .item{padding:12px}
.gallery .item p{text-align:center;margin-top:8px}
.teacher-card{text-align:center;position:relative;padding-top:26px;border-top:3px solid #b9e5c7}.teacher-card h3{margin-top:8px}.teacher-card .icon-box{box-shadow:0 0 0 6px #f3fbf5}
.teacher-card .icon-box{border-radius:50%}
.notice{background:#eff9f2;border-right:4px solid var(--green2);padding:16px 20px;border-radius:12px;color:#28583b}
.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.contact-cell{background:#f1faf4;border:1px solid #e1efe5;padding:15px;border-radius:14px}
.contact-cell strong{display:block;color:var(--green)}
.results-note{max-width:760px;margin:auto}
footer{background:#eaf7ee;color:#214b32;padding:28px 16px 18px;text-align:center;margin-top:15px;border-top:1px solid #d9ecdf}
footer p{margin:3px 0}
.footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin:12px 0}
.footer-links a{color:var(--green);text-decoration:none;font-weight:600}
.admin-link{font-size:12px;opacity:.8;color:var(--green);display:inline-block;margin-top:12px}
@media(min-width:900px){.grid.two{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:650px){.brand{flex-direction:column;gap:8px}.logo{width:82px;height:82px}.brand-copy h1{font-size:25px}.hero-panel{min-height:330px;border-radius:18px}.feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.contact-grid{grid-template-columns:1fr}nav{gap:3px}nav a{font-size:13px;padding:5px 9px}.gallery img{height:190px}}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.hero{padding:0 12px}.grid{grid-template-columns:1fr}.card{padding:20px 15px}.hero h2{font-size:26px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
